# Runs the quick checks (npm run check) on every push and pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

# Read-only: checks never need to change the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/check.mjs

; System stats with bars, a two-line graph, web data and an unsupported plugin.
[Rainmeter]
Update=1000

[Variables]
@Include=#@#Variables.inc

[MeasureCPU]
Measure=CPU

[MeasureCore1]
Measure=CPU
Processor=1

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[MeasureUptime]
Measure=Uptime

[MeasureWeb]
Measure=WebParser
URL=https://example.test/feed
RegExp=(?siU)<title>(.*)</title>.*<title>(.*)</title>
StringIndex=1
Substitute="&amp;":"&"

[MeasureWebSecond]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=2

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel

[MeterBar]
Meter=Bar
MeasureName=MeasureCPU
X=10
Y=10
W=100
H=8
BarColor=#Accent#
BarOrientation=Horizontal
SolidColor=255,255,255,30

[MeterGraph]
Meter=Line
MeasureName=MeasureCPU
MeasureName2=MeasureCore1
LineCount=2
X=0r
Y=4R
W=100
H=30

[MeterDisk]
Meter=String
MeasureName=MeasureDisk
X=110
Y=0
StringAlign=Right
AutoScale=1
Text=%1B used
FontSize=8

[MeterUptime]
Meter=String
MeasureName=MeasureUptime
X=10
Y=60
FontSize=8

[MeterWeb]
Meter=String
MeasureName=MeasureWeb
MeasureName2=MeasureWebSecond
X=0r
Y=0R
Text=%1 / %2
FontSize=8

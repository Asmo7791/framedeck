; A small analog clock that uses the common Rainmeter features.
[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=20,20,24,255
OnRefreshAction=[!SetVariable Greeting "Hello"]

[Variables]
@Include=#@#Variables.inc
Radius=50

[MeasureSeconds]
Measure=Time

[MeasureHour]
Measure=Time
Format=%H

[MeasureDouble]
Measure=Calc
Formula=MeasureHour * 2 + (1 ** 3)
IfCondition=MeasureDouble >= 0
IfTrueAction=[!SetOption MeterLabel FontColor "#Accent#"][!HideMeter MeterHidden]

[StyleText]
FontFace=Arial
FontSize=#Size#
FontColor=#TextColor#
StringAlign=Center
AntiAlias=1

[MeterFace]
Meter=Shape
X=0
Y=0
Shape=Ellipse 60,60,#Radius# | Fill Color 40,40,48 | StrokeWidth 2 | Stroke Color #Accent#

[MeterSecondHand]
Meter=Roundline
MeasureName=MeasureSeconds
X=10
Y=10
W=100
H=100
StartAngle=4.71239
RotationAngle=6.28318
ValueRemainder=60
LineLength=45
LineColor=#Accent#
LineWidth=2

[MeterLabel]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureHour
X=60
Y=5R
Text=%1 o'clock
DynamicVariables=1

[MeterGreeting]
Meter=String
MeterStyle=StyleText
X=0r
Y=2R
Text=#Greeting#
DynamicVariables=1

[MeterHidden]
Meter=String
Text=You should not see this
X=0
Y=0
